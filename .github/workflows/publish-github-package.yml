name: Publish GitHub package

run-name: Publish @woof-software/ponder@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version, the current ponder version with a -woof.N suffix (for example, 0.17.12-woof.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Validate release
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Packages can only be published from main."
            exit 1
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-woof\.[0-9]+$ ]]; then
            echo "Version must match X.Y.Z-woof.N."
            exit 1
          fi
          BASE_VERSION=$(jq -r .version packages/core/package.json)
          if [[ "${PACKAGE_VERSION%-woof.*}" != "$BASE_VERSION" ]]; then
            echo "Version must start with the current ponder version $BASE_VERSION."
            exit 1
          fi

      - name: Setup
        uses: ./.github/actions/setup
        with:
          foundry: "false"

      - name: Build
        run: pnpm --filter "ponder..." build

      - name: Prepare package
        working-directory: packages/core
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          npm pkg set "name=@woof-software/ponder"
          npm pkg set "version=$PACKAGE_VERSION"
          npm pkg set "repository.url=https://github.com/woof-software/ponder.git"

      # pnpm 11 ignores the NPM_CONFIG_USERCONFIG file written by setup-node and reads ~/.npmrc.
      - name: Configure registry
        run: |
          echo "@woof-software:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      # pnpm-workspace.yaml enables provenance, which GitHub Packages does not support.
      - name: Publish
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks --no-provenance
