name: Publish tarball

run-name: Publish ponder@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version, the current ponder version with a -woof.N suffix (for example, 0.18.8-woof.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Packages can only be published from main."
            exit 1
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-woof\.[0-9]+$ ]]; then
            echo "Version must match X.Y.Z-woof.N."
            exit 1
          fi
          BASE_VERSION=$(jq -r .version packages/core/package.json)
          if [[ "${PACKAGE_VERSION%-woof.*}" != "$BASE_VERSION" ]]; then
            echo "Version must start with the current ponder version $BASE_VERSION."
            exit 1
          fi

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "ponder..." build

      - name: Prepare package
        working-directory: packages/core
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          npm pkg set "version=$PACKAGE_VERSION"
          npm pkg set "repository.url=https://github.com/woof-software/ponder.git"

      # pnpm pack, unlike npm pack, replaces workspace:* with the published @ponder/utils version.
      - name: Pack
        working-directory: packages/core
        run: pnpm pack

      - name: Create release
        working-directory: packages/core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          TARBALL="ponder-$PACKAGE_VERSION.tgz"
          gh release create "v$PACKAGE_VERSION" "$TARBALL" --target "$GITHUB_SHA" \
            --title "ponder $PACKAGE_VERSION" \
            --notes "\"ponder\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/v$PACKAGE_VERSION/$TARBALL\""
