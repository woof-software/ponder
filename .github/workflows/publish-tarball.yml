name: Publish tarball

run-name: Publish ponder@${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version, the current ponder version with a -woof.N suffix (for example, 0.17.12-woof.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Validate release
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Packages can only be published from main."
            exit 1
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-woof\.[0-9]+$ ]]; then
            echo "Version must match X.Y.Z-woof.N."
            exit 1
          fi
          BASE_VERSION=$(jq -r .version packages/core/package.json)
          if [[ "${PACKAGE_VERSION%-woof.*}" != "$BASE_VERSION" ]]; then
            echo "Version must start with the current ponder version $BASE_VERSION."
            exit 1
          fi

      - name: Setup
        uses: ./.github/actions/setup
        with:
          foundry: "false"

      - name: Build
        run: pnpm --filter "ponder..." build

      - name: Prepare package
        working-directory: packages/core
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          npm pkg set "version=$PACKAGE_VERSION"
          npm pkg set "repository.url=https://github.com/woof-software/ponder.git"

      # pnpm pack, unlike npm pack, replaces workspace:* with the published @ponder/utils version.
      - name: Pack
        working-directory: packages/core
        run: pnpm pack

      - name: Create release
        working-directory: packages/core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          TARBALL="ponder-$PACKAGE_VERSION.tgz"
          gh release create "v$PACKAGE_VERSION" "$TARBALL" --target "$GITHUB_SHA" \
            --title "ponder $PACKAGE_VERSION" \
            --notes "\"ponder\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/v$PACKAGE_VERSION/$TARBALL\""
