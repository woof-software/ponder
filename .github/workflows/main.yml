name: Main

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Setup Postgres
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm --filter "ponder..." build

      - name: Test types
        run: pnpm --filter ponder test:typecheck

      - name: Test database actions
        env:
          CI: "1"
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: pnpm --filter ponder test src/database/actions.test.ts
